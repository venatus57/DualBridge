name: Installers

# - Pushing a tag like v0.2.0 creates a GitHub pre-release (notes from
#   .github/release-notes.md) and attaches the Windows .exe and macOS .dmg.
# - "Run workflow" (manual) and pull requests build the same installers and
#   upload them as workflow artifacts, for testing before a release.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # On a version tag, create the GitHub pre-release once, before the builds
  # upload their installers to it (so the two builds don't race to create it).
  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --prerelease --title "DualBridge $GITHUB_REF_NAME" --notes-file .github/release-notes.md

  build:
    name: ${{ matrix.name }}
    needs: release
    # Runs on pull requests and manual runs too, where "release" is skipped.
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer (.exe)
            os: windows-latest
            args: ""
            bundles: target/release/bundle/nsis/*.exe
          - name: macOS disk image (.dmg)
            os: macos-latest
            args: --target universal-apple-darwin
            bundles: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app

      # Bundle the driver installers (ViGEmBus, HidHide) so the DualBridge
      # installer can install them. See app/src-tauri/drivers/README.txt.
      - name: Download driver installers
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          fetch() { # repo, tag ("" = latest), output name
            local tmp; tmp=$(mktemp -d)
            if gh release download $2 --repo "$1" --pattern '*.exe' --dir "$tmp"; then
              local f; f=$(ls "$tmp"/*.exe | grep -i x64 | head -n1 || true)
              [ -z "$f" ] && f=$(ls "$tmp"/*.exe | head -n1)
              cp "$f" "app/src-tauri/drivers/$3"
              echo "Bundled $(basename "$f") as $3"
            else
              echo "::warning::Could not download $3 from $1; the installer will not offer it."
            fi
          }
          fetch nefarius/ViGEmBus v1.22.0 ViGEmBus_Setup.exe
          fetch nefarius/HidHide "" HidHide_Setup.exe
          ls -la app/src-tauri/drivers

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: DualBridge ${{ github.ref_name }}
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

      - name: Build installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          args: ${{ matrix.args }}

      - name: Upload installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: DualBridge-${{ runner.os }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
