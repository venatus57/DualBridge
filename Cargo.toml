[workspace]
resolver = "2"
members = [
    "crates/dualbridge-core",
    "crates/dualbridge-hid",
    "crates/dualbridge-virtual",
    "app/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/venatus57/DualBridge"
rust-version = "1.90"

[workspace.dependencies]
dualbridge-core = { path = "crates/dualbridge-core" }
dualbridge-hid = { path = "crates/dualbridge-hid" }
dualbridge-virtual = { path = "crates/dualbridge-virtual" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
